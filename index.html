<h1>ghealth personal</h1>
<p>A private, single-user tool that reads the owner's own data from the Google Health API using the open-source
<a href="https://github.com/Google-Health-API/google-health-cli">Google Health CLI</a> and saves it to the owner's own Google Drive for personal analysis.</p>
<p>It is not offered to the public and has no other users.</p>
<p><a href="privacy.html">Privacy policy</a></p>
